version: "2"
sql:
  - engine: postgresql
    schema:
      - db/migrations/000001_init.up.sql
      - db/migrations/000002_route_fallback.up.sql
      - db/migrations/000003_provider_health.up.sql
      - db/migrations/000004_budget_alerts.up.sql
      - db/migrations/000005_api_key_quota.up.sql
      - db/migrations/000006_model_pricing_versions.up.sql
      - db/migrations/000007_admin_audit_logs.up.sql
      - db/migrations/000008_route_policy_config.up.sql
      - db/migrations/000009_route_lowest_latency.up.sql
      - db/migrations/000010_cache_events.up.sql
      - db/migrations/000011_semantic_cache_events.up.sql
      - db/migrations/000012_content_policies.up.sql
      - db/migrations/000013_rbac.up.sql
      - db/migrations/000014_cost_anomaly_policies.up.sql
      - db/migrations/000015_magic_link_tokens.up.sql
    queries: db/query
    gen:
      go:
        package: sqlc
        out: internal/store/sqlc
        sql_package: pgx/v5
        emit_db_tags: true
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: pg_catalog.text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
          - db_type: jsonb
            nullable: true
            go_type:
              import: encoding/json
              type: RawMessage
              pointer: true
