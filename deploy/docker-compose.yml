services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: llmgw
      POSTGRES_PASSWORD: llmgw
      POSTGRES_DB: llmgw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmgw -d llmgw"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    build:
      context: .
      dockerfile: deploy/gateway.Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    environment:
      APP_ENV: development
      SERVER_PORT: "8080"
      DATABASE_URL: postgres://llmgw:llmgw@postgres:5432/llmgw?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PLATFORM_BOOTSTRAP_TOKEN: dev-bootstrap-token
      TOKEN_HASH_SECRET: dev-token-hash-secret
      SECRET_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      LOG_LEVEL: info
      MAX_RETRIES: "1"
      RETRY_BACKOFF_MS: "100"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  console:
    build:
      context: .
      dockerfile: deploy/console.Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      - gateway

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway

  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["migrate"]

volumes:
  postgres_data:
