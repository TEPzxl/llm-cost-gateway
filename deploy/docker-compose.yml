services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: llmgw
      POSTGRES_PASSWORD: llmgw
      POSTGRES_DB: llmgw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmgw -d llmgw"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: bitnami/kafka:3.7
    profiles: ["events"]
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    profiles: ["analytics"]
    environment:
      CLICKHOUSE_DB: llmgw
      CLICKHOUSE_USER: llmgw
      CLICKHOUSE_PASSWORD: llmgw
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./db/clickhouse:/docker-entrypoint-initdb.d:ro
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    build:
      context: .
      dockerfile: deploy/gateway.Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    environment:
      APP_ENV: development
      SERVER_PORT: "8080"
      DATABASE_URL: postgres://llmgw:llmgw@postgres:5432/llmgw?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PLATFORM_BOOTSTRAP_TOKEN: dev-bootstrap-token
      TOKEN_HASH_SECRET: dev-token-hash-secret
      SECRET_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      LOG_LEVEL: info
      MAX_RETRIES: "1"
      RETRY_BACKOFF_MS: "100"
      KAFKA_ENABLED: "false"
      KAFKA_BROKERS: kafka:9092
      KAFKA_USAGE_TOPIC: llm-usage-events
      CLICKHOUSE_ENABLED: "false"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: llmgw
      CLICKHOUSE_USERNAME: llmgw
      CLICKHOUSE_PASSWORD: llmgw
      TRACING_ENABLED: "false"
      TRACING_OTLP_ENDPOINT: otel-collector:4318
      TRACING_INSECURE: "true"
      TRACING_SERVICE_NAME: llm-cost-gateway
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  console:
    build:
      context: .
      dockerfile: deploy/console.Dockerfile
      args:
        API_PROXY_TARGET: http://gateway:8080
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      - gateway

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway

  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["migrate"]

volumes:
  postgres_data:
  clickhouse_data:
